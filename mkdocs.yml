site_name: Plasma
site_description: The open-source real-time intelligence platform — documentation.
site_url: https://docs.plasma.sh
repo_url: https://github.com/plasmash
repo_name: plasmash
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: black
    accent: teal
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Install: install.md
  - Architecture: architecture.md
  - Concepts: concepts.md
  - CLI reference:
      - Overview: cli/index.md
      - plasmactl: cli/plasmactl.md
      - model: cli/model.md
      - component: cli/component.md
      - platform: cli/platform.md
      - node: cli/node.md
      - topology: cli/topology.md
      - processors: cli/processors.md
  - Deployment: deployment.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plasmash
    - icon: material/web
      link: https://plasma.sh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
