site_name: Plasma
site_description: The open-source real-time intelligence platform — documentation.
site_url: https://docs.plasma.sh
repo_url: https://github.com/plasmash
repo_name: plasmash
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Quickstart: quickstart.md
  - Concepts:
      - Overview: concepts/index.md
      - Architecture & layers: concepts/architecture.md
      - Component model: concepts/component-model.md
      - Choreography & channels: concepts/choreography.md
      - Core patterns: concepts/patterns.md
      - Topology & nodes: concepts/topology.md
  - Build:
      - Overview: build/index.md
      - Component anatomy: build/component-anatomy.md
      - Configuration: build/configuration.md
      - Templates & filters: build/templates.md
      - Entity schemas: build/schemas.md
      - Kubernetes patterns: build/kubernetes.md
      - Defining agents: build/agents.md
  - Operate:
      - Overview: operate/index.md
      - Platform lifecycle: operate/lifecycle.md
      - Nodes & topology: operate/nodes.md
      - Deploying: operate/deploying.md
      - Investigating a platform: operate/investigating.md
      - Debugging: operate/debugging.md
  - CLI reference:
      - Overview: cli/index.md
      - plasmactl: cli/plasmactl.md
      - model: cli/model.md
      - component: cli/component.md
      - platform: cli/platform.md
      - node: cli/node.md
      - zone: cli/zone.md
      - auth: cli/auth.md
      - processors: cli/processors.md
  - Integrate:
      - MCP server: integrate/mcp.md
      - Automation: integrate/automation.md
  - Reference:
      - Glossary: reference/glossary.md
      - Dependency graph: reference/graph.md
  - About:
      - Open-core: about/open-core.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plasmash
    - icon: material/web
      link: https://plasma.sh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
